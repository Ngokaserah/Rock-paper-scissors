<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="shortcut icon" href="./main-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Choose your move, beat the computer and win the game!.</h1>
        
    <div>
        <h2>Rock-Paper-Scissors</h2>

        <p class="score">User: <b id="userscore">0</b></p>
        <p class="score">Computer: <b id="compscore" >0</b></p>
        
        
       <div class="game-btn">
        <button onclick="playGame('rock')"> <span>✊ </span> Rock</button>
        <button onclick="playGame('paper')" > <span>✋ </span> Paper</button>
        <button onclick="playGame('scissors')" > <span>✌️ </span> Scissors</button> 
       </div>

       <small id="comp"></small>
        <p id="board"></p>
        <button id="rbtn" class="rbtn">Reset</button>

        
    </div>

    <footer>Copyright © <b id="year"></b> Ngoka Serah(Splendid). All rights reserved.</footer>
  

    <script src="./script.js"></script>
</body>
</html>
